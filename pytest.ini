[pytest]
testpaths = tests
pythonpath = .
markers =
    model: needs the real 325 MB StyleGAN model in cache/ (run with: pytest -m model)
    network: downloads from the internet (run with: pytest -m network)
# The default run needs neither the model nor the internet.
addopts = -m "not model and not network"
# Deprecation noise from TensorFlow 1.15's own code (not this project's)
filterwarnings =
    ignore::DeprecationWarning:tensorflow.*
    ignore::DeprecationWarning:tensorboard.*
    ignore::DeprecationWarning:google.*
    ignore::PendingDeprecationWarning:tensorflow.*
